<style>
/* 页面私有样式一律 f13- 前缀，只借主站 :root 变量与字体，不碰主站类 */

   ⇒ 导航外观归主站 .tab 一处定义，本页只管排布与右侧控件（一处样式一个实现）。 */

   本页 nav 补该祖先类即与路由页同源；此前只吃到基础 .tab（带框胶囊）⇒ 两套观感。 */

/* 🐛 2026-08-18 修：`.f13-nav2 a`(0,1,1) 特异性压过 `.f13-subbtn`(0,1,0)，
   padding 被覆盖成 2px 0 ⇒ 按钮塌成 29×29 + 20px 圆角 = 红圆球（Klay 两次圈图）。

.f13-navctl a.f13-subbtn { font-size: 13px; font-weight: 600; color: #fff !important; background: var(--accent); border-radius: 20px; padding: 6px 16px; white-space: nowrap; flex-shrink: 0; }

.f13-langbtn:hover { color: var(--ink); border-color: var(--ink-muted); }
.f13-logo { width: 17px; height: 17px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; background: #fff; }

.f13-sub { font-size: 13.5px; color: var(--ink-soft); line-height: 1.8; max-width: 760px; }
.f13-fresh { font-size: 12px; color: var(--ink-muted); margin: 10px 0 26px; }
.f13-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; }
.f13-legend .sw { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
/* 目录去盒化（2026-08-18 Klay：和其他 tab 页格格不入）。
   站上 07-26 已为目录定过调（css/style.css 的 .toc 一节）：原本每章一个圆角边框块 +
   选中态填充底色，判为与旧 tab 同一个毛病＝组件库默认值观感，改成
   **纯文字列表 + 左侧 2px 色条标记当前项，与顶栏导航同一套语言**。
   我先前那版黑底圆角卡片 + logo 头像，正是那个已被淘汰的形状 ⇒ 照既有语言重做，
   并去掉机构 logo/字母头像（Klay：只写名字就行）。
   实心/描边这条判据不靠色块表达，改为**文字浓淡 + 分组小标题**：
   集中决策＝正常墨色，只报规模＝弱化色，语义不丢而视觉不吵。 */
.f13-layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 24px; align-items: start; padding: 0 16px 80px; }
.f13-side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 6px; }
.f13-cap {
  display: block; cursor: pointer;
  border: none; border-left: 2px solid transparent; border-radius: 0; background: transparent;
  padding: 6px 10px; margin-bottom: 1px;
  font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.f13-cap:hover { background: var(--bg-card-hover); }
.f13-cap .nm { font-size: 12.5px; color: var(--ink-muted); font-weight: 500; }
.f13-cap .meta { font-size: 10.5px; color: var(--ink-muted); opacity: .62; margin-top: 1px; }
.f13-cap.solid .nm { color: var(--ink); }            /* 集中决策＝正常墨色 */
.f13-cap:not(.solid) .nm { color: var(--ink-muted); } /* 只报规模＝弱化 */
.f13-cap.on { border-left-color: var(--accent); background: var(--bg-card-hover); }
.f13-cap.on .nm { color: var(--ink); font-weight: 700; }
.f13-cap.dis { opacity: .4; cursor: default; }
.f13-cap.dis:hover { background: transparent; }
.f13-groupttl { font-size: 10.5px; color: var(--ink-muted); letter-spacing: .08em; margin: 16px 0 6px; padding-left: 10px; opacity: .75; }
.f13-groupttl:first-child { margin-top: 0; }
@media (max-width: 860px) { .f13-layout { grid-template-columns: 1fr; } .f13-side { position: static; max-height: none; } }
.f13-panel { border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); padding: 20px 22px 24px; margin: 0 0 40px; }
.f13-panel h2 { font-family: 'Noto Serif SC',serif; font-size: 20px; margin: 0 0 4px; color: var(--ink); }
.f13-panel .pmeta { font-size: 12.5px; color: var(--ink-muted); font-family: 'JetBrains Mono',monospace; margin-bottom: 14px; }
.f13-panel h3 { font-size: 14px; color: var(--ink); margin: 22px 0 8px; }
table.f13 { width: 100%; border-collapse: collapse; font-size: 13px; }
table.f13 th { text-align: right; font-weight: 600; color: var(--ink-muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.f13 th:first-child, table.f13 td:first-child { text-align: left; }
table.f13 td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono',monospace; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
table.f13 td.iss { font-family: inherit; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.f13-scroll { overflow-x: auto; }
.f13-pos { color: var(--up, #C0392B); } .f13-neg { color: var(--down, #1D9E75); }
.f13-pbar { display: inline-block; height: 7px; border-radius: 4px; background: var(--accent); vertical-align: 1px; margin-right: 6px; opacity: .8; }
.f13-tl { display: flex; align-items: flex-end; gap: 2px; height: 92px; margin: 8px 0 2px; }
.f13-tl .b { flex: 1; background: var(--accent); opacity: .55; border-radius: 2px 2px 0 0; min-width: 2px; }
.f13-tl .b:hover { opacity: 1; }
.f13-tlx { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-muted); font-family: 'JetBrains Mono',monospace; }
.f13-srow { margin: 10px 0 2px; }
.f13-srow .lbl { font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
.f13-mini { display: flex; align-items: flex-end; gap: 1.5px; height: 30px; }
.f13-mini .b { flex: 1; background: var(--ink-soft); opacity: .5; border-radius: 1px; min-width: 1.5px; }
.f13-note { font-size: 12.5px; color: var(--ink-muted); line-height: 1.9; margin-top: 34px; border-top: 1px solid var(--border); padding-top: 16px; max-width: 820px; }
@media (max-width: 640px) { .f13-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
</style>

<body>
<div class="f13-wrap">
  <div class="f13-top">

      <a class="tab" href="/">今日</a>

<div class="f13-layout">
  <aside class="f13-side" id="wall"></aside>
  <main class="f13-main">
  <h1 class="f13">13F 开奖</h1>
  <p class="f13-sub">机构每季向 SEC 申报美股多头持仓（13F），季末快照、45 天后披露。滞后不是缺陷，是原材料：<b>季末到披露日之间那段走势，在披露当天就已经是已知的、可复算的</b>。本页只对账：不算机构盈亏（13F 无成本价、无空头腿），不归因，不给跟不跟。</p>
  <div class="f13-fresh" id="fresh">加载中…</div>
  <div class="f13-legend">
    <span><span class="sw" style="background:var(--ink)"></span><b class="f13-i18n" data-en="Solid">实心</b>＝集中决策：每一笔都是一个决策体的判断，可逐笔看</span>
    <span><span class="sw" style="border:1.5px solid var(--border);background:var(--bg-card)"></span><b class="f13-i18n" data-en="Outline">描边</b>＝平台多策略 / 系统化 / 主权配置：只报规模。从几千行里挑一只说它看好，等于从一栋楼里挑一个房客说这栋楼喜欢他</span>
  </div>
    <div id="panel"></div>
    <div class="f13-note" id="foot"></div>
  </main>

<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  let D;
  try {
    const r = await fetch("data/f13_page.json", { cache: "no-store" });
    D = await r.json();
  } catch (e) { $("#fresh").textContent = "数据加载失败，请刷新重试。"; return; }
  const _EN = localStorage.getItem("mc-lang") === "en";
  const NM = (c) => _EN ? (c.en || c.cn) : c.cn;
  const DT = (c) => _EN ? (c.decision_type_en || c.decision_type) : c.decision_type;
  const B = (v) => v == null ? "·" : (v >= 1e12 ? "$" + (v / 1e12).toFixed(2) + "T" : v >= 1e9 ? "$" + (v / 1e9).toFixed(1) + "B" : "$" + Math.round(v / 1e6).toLocaleString() + "M");
  const N = (v) => v == null ? "·" : Number(v).toLocaleString();
  $("#fresh").textContent = _EN
    ? "Latest period " + D.latest_quarter + " (filing dates on each card) · assembled " + D.generated_at.slice(0, 10) + " · source: SEC EDGAR 13F-HR, read directly"
    : "最新报告期 " + D.latest_quarter + "（各家披露日见胶囊）· 页面装配 " + D.generated_at.slice(0, 10) + " · 源：SEC EDGAR 13F-HR 直读";
  const wall = $("#wall");
  const G = _EN
    ? ["Solid · concentrated decision (position by position)",
       "Outline · multi-strategy / systematic / sovereign (size only)",
       "Not read directly (no standalone 13F-HR filer)"]
    : ["实心 · 集中决策（可逐笔）", "描边 · 平台多策略 / 系统化 / 主权配置（只报规模）",
       "未直读（无独立 13F-HR 主体，如实标）"];
  const groups = [[G[0], D.capsules.filter(c => c.solid)],
                  [G[1], D.capsules.filter(c => !c.solid && c.value_usd)],
                  [G[2], D.capsules.filter(c => !c.solid && !c.value_usd)]];
  for (const [ttl, list] of groups) {
    if (!list.length) continue;
    const h = document.createElement("div"); h.className = "f13-groupttl"; h.textContent = ttl; wall.appendChild(h);
    const g = wall;
    list.sort((a, b) => (b.value_usd || 0) - (a.value_usd || 0));
    for (const c of list) {
      const el = document.createElement("div");
      el.className = "f13-cap" + (c.solid ? " solid" : "") + (c.value_usd ? "" : " dis");
      el.innerHTML = '<div class="nm">' + NM(c) + '</div><div class="meta">' +
        (c.solid ? (c.n_holdings != null ? c.n_holdings + (_EN ? " positions · " : " 笔 · ") : "")
                 : (c.entries ? c.entries.toLocaleString() + (_EN ? " rows · " : " 条 · ") : "")) +
        B(c.value_usd) + (c.history_n ? " · " + c.history_n + (_EN ? "q" : " 期") : "") + "</div>";
      if (c.value_usd) el.onclick = () => show(c, el);
      g.appendChild(el);
    }
  }
  const first = D.capsules.filter(c => c.solid).sort((a, b) => (b.value_usd || 0) - (a.value_usd || 0))[0];
  if (first) { const el = [...document.querySelectorAll(".f13-cap")].find(x => x.textContent.includes(NM(first))); if (el) show(first, el); }
  function show(c, el) {
    document.querySelectorAll(".f13-cap.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const d = (D.institutions || {})[c.cn] || {};
    let h = '<h2>' + NM(c) + '</h2><div class="pmeta">' + DT(c) + (_EN ? " · period " : " · 报告期 ") + (c.period || "·")
      + (_EN ? " · filed " : " · 披露 ") + (c.filing_date || "·") + (_EN ? " · book " : " · 组合 ") + B(c.value_usd) +
      (d.accession ? " · acc " + d.accession : "") + "</div>";
    if (!c.solid) {
      h += _EN
        ? '<p class="f13-sub">This is a ' + c.decision_type + ' filer: the table is the sum of hundreds of separate strategy books, so no single position reads as a house judgement. Size only here (' +
          (c.entries ? c.entries.toLocaleString() : "\u00b7") + ' rows · ' + B(c.value_usd) + ').</p>'
        : '<p class="f13-sub">这家是' + DT(c) + '：持仓表是几百个策略各自仓位的加总，单只持仓读不出机构判断，所以本页对它只报规模（' +
          (c.entries ? c.entries.toLocaleString() : "·") + ' 条持仓 · ' + B(c.value_usd) + '）。</p>';
    }
    if (d.ledger && d.ledger.length) {
      h += '<h3>' + (_EN ? "Scorecard: quarter-end to filing-date price (recomputable)" : "开奖表 · 季末价 → 披露日价（可复算）") + '</h3><div class="f13-scroll"><table class="f13"><tr><th>票</th><th>动作</th><th>名义</th><th>占组合</th><th>季末收</th><th>披露日收</th><th>区间涨跌</th><th>来源</th></tr>';
      for (const r of d.ledger) {
        const ch = parseFloat(r.chg_pct);
        h += '<tr><td><img class="f13-logo" src="logos/' + r.ticker.toLowerCase() + '.png" alt="" loading="lazy" onerror="this.remove()">' + r.ticker + "</td><td>" + r.action + "</td><td>" + B(+r.notional_usd) + "</td><td>" +
          (r.pct_of_book ? r.pct_of_book + "%" : "·") + "</td><td>" + (r.px_quarter_end || "·") + "</td><td>" + (r.px_filing || "·") +
          '</td><td class="' + (ch >= 0 ? "f13-pos" : "f13-neg") + '">' + (isNaN(ch) ? "·" : (ch > 0 ? "+" : "") + ch + "%") +
          "</td><td>" + r.source_grade + "</td></tr>";
      }
      h += "</table></div>";
    }
    if (d.holdings && d.holdings.length) {
      const mx = d.holdings[0].pct || 1;
      h += '<h3>' + (_EN ? "Top " + d.holdings.length + " holdings (by value)" : "最新持仓 · 前 " + d.holdings.length + "（按市值）") + '</h3><div class="f13-scroll"><table class="f13"><tr><th>发行人</th><th>市值</th><th>股数</th><th>占组合</th></tr>';
      for (const r of d.holdings) {
        h += '<tr><td class="iss">' + (r.tk ? '<img class="f13-logo" src="logos/' + r.tk + '.png" alt="" loading="lazy" onerror="this.remove()">' : "") + r.issuer + "</td><td>" + B(r.value_usd) + "</td><td>" + N(r.shares) +
          '</td><td><span class="f13-pbar" style="width:' + Math.max(2, r.pct / mx * 70) + 'px"></span>' + r.pct + "%</td></tr>";
      }
      if (d.holdings_rest && d.holdings_rest.n) h += '<tr><td class="iss">' + (_EN ? "Other " + d.holdings_rest.n + " names combined" : "其余 " + d.holdings_rest.n + " 只合计") + '</td><td>' + B(d.holdings_rest.value_usd) + "</td><td>·</td><td>·</td></tr>";
      h += "</table></div>";
    }
    if (d.timeline && d.timeline.periods.length > 1) {
      const ps = d.timeline.periods, vs = d.timeline.value_total, mx = Math.max(...vs);
      h += '<h3>' + (_EN ? "Timeline: book value (" + ps.length + " quarters, " + ps[0] + " to " + ps[ps.length - 1] + ")"
                          : "时间轴 · 组合总值（" + ps.length + " 期：" + ps[0] + " → " + ps[ps.length - 1] + "）") + '</h3><div class="f13-tl">' +
        vs.map((v, i) => '<div class="b" style="height:' + Math.max(2, v / mx * 100) + '%" title="' + ps[i] + " " + B(v) + '"></div>').join("") +
        '</div><div class="f13-tlx"><span>' + ps[0] + "</span><span>" + ps[ps.length - 1] + "</span></div>";
      if (d.timeline.shares_top) {
        h += '<h3>' + (_EN ? "Share count by quarter (current top names; steady accumulation is a shape here, not an adjective)" : "持仓股数逐期（当前前几大 · 连续加仓在这里是能看见的形状）") + '</h3>';
        let cnt = 0;
        for (const [iss, ss] of Object.entries(d.timeline.shares_top)) {
          if (++cnt > 5) break;
          const m2 = Math.max(...ss, 1);
          h += '<div class="f13-srow"><div class="lbl">' + iss + '</div><div class="f13-mini">' +
            ss.map((v, i) => '<div class="b" style="height:' + Math.max(3, v / m2 * 100) + '%" title="' + ps[i] + " " + N(v) + ' 股"></div>').join("") + "</div></div>";
        }
      }
    } else if (c.solid) {
      h += '<p class="f13-sub">时间轴回补中：全史逐期数据正在从 EDGAR 补齐，补到即显示。</p>';
    }
    $("#panel").innerHTML = '<div class="f13-panel">' + h + "</div>";

  }
  $("#foot").innerHTML = "数据：SEC EDGAR 13F-HR 原始申报直读，逐期校验（各期持仓合计与封面总值对账）。13F 只含美股多头，无成本价、无期权与空头腿，因此本页不计算任何机构的盈亏，也不构成任何投资建议。名义额口径：增减持＝股数变动×季末收盘，新进＝期末市值，清仓＝上期期末市值。";
  // 语言切换：与主站/期权页同一 localStorage 键 mc-lang，同用刷新制（文案由 JS 现拼，不走 D 键）
  const L = localStorage.getItem("mc-lang") === "en" ? "en" : "zh";
  const lb = document.getElementById("f13-lang");
  if (lb) {
    lb.textContent = L === "zh" ? "EN" : "简";
    lb.onclick = () => { localStorage.setItem("mc-lang", L === "zh" ? "en" : "zh"); location.reload(); };
  }
  if (L === "en") {
    document.documentElement.lang = "en";
    document.title = "13F Scorecard · Market Chronicle";
    const TR = {
      "美股编年史": "Market Chronicle", "订阅": "Subscribe",
      "今日": "Today", "K 指数 · 台账": "KAPX · Ledger",
      "恐惧的标价 · 台账": "Fear-Price Index · Ledger",

    };
    const walk = (n) => {
      for (const c of [...n.childNodes]) {
        if (c.nodeType === 3) { const t = c.nodeValue.trim(); if (TR[t]) c.nodeValue = c.nodeValue.replace(t, TR[t]); }
        else if (c.nodeType === 1 && !["SCRIPT", "STYLE"].includes(c.tagName)) walk(c);
      }
    };
    document.querySelectorAll("[data-en]").forEach((e) => { e.textContent = e.dataset.en; });
    const RX = [
      [/^最新持仓 · 前 (\d+)（按市值）$/, (m) => `Top ${m[1]} holdings (by value)`],
      [/^时间轴 · 组合总值（(\d+) 期：(\S+) → (\S+)）$/, (m) => `Timeline: book value (${m[1]} quarters, ${m[2]} to ${m[3]})`],
      [/^持仓股数逐期（当前前几大 · 连续加仓在这里是能看见的形状）$/, () => "Share count by quarter (current top names; steady accumulation is a shape here, not an adjective)"],
      [/^其余 (\d+) 只合计$/, (m) => `Other ${m[1]} names combined`],
      [/^(\d+) 笔 · (.+)$/, (m) => `${m[1]} positions · ${m[2]}`],
      [/^([\d,]+) 条 · (.+)$/, (m) => `${m[1]} rows · ${m[2]}`],
      [/(\d+) 期$/, (m) => `${m[1]}q`],
      [/^集中决策 · 报告期 (\S+) · 披露 (\S+) · 组合 (\S+)(.*)$/, (m) => `Concentrated · period ${m[1]} · filed ${m[2]} · book ${m[3]}${m[4]}`],
    ];
    const walk2 = (n) => {
      for (const c of [...n.childNodes]) {
        if (c.nodeType === 3) {
          const t = c.nodeValue.trim();
          if (TR[t]) { c.nodeValue = c.nodeValue.replace(t, TR[t]); continue; }
          for (const [rx, fn] of RX) { const m = t.match(rx); if (m) { c.nodeValue = c.nodeValue.replace(t, fn(m)); break; } }
        } else if (c.nodeType === 1 && !["SCRIPT", "STYLE"].includes(c.tagName)) walk2(c);
      }
    };
    window.__f13walk = walk2;
    walk2(document.body);
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((n) => n.nodeType === 1 && window.__f13walk(n))))
      .observe(document.body, { childList: true, subtree: true });
  }
  const tt = document.getElementById("f13-theme");
  if (tt) tt.onclick = () => {
    const dark = document.documentElement.classList.toggle("dark-mode");
    try { localStorage.setItem("mc-theme", dark ? "dark" : "light"); } catch (e) {}
  };
})();
